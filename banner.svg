<svg width="1400" height="500" viewBox="0 0 1400 500" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowYellow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .pixel {
        font-family: monospace;
        font-weight: bold;
      }

      .title {
        font-size: 110px;
        fill: #ffe600;
        filter: url(#glowYellow);
      }

      .green {
        fill: #00ff66;
      }

      .purple {
        fill: #6d63ff;
      }

      .white {
        fill: #ffffff;
      }
    </style>

  </defs>

  <!-- Fundo -->

  <rect width="1400" height="500" rx="25" fill="#02050d"/>

  <!-- Moldura -->

  <rect
    x="15"
    y="15"
    width="1370"
    height="470"
    rx="20"
    fill="none"
    stroke="#29c5ff"
    stroke-width="4"
    filter="url(#glowBlue)"
  />

  <!-- Cantos -->

  <path d="M55 55 H85 M55 55 V85" stroke="#29c5ff" stroke-width="5" fill="none"/>
  <path d="M1315 55 H1345 M1345 55 V85" stroke="#29c5ff" stroke-width="5" fill="none"/>
  <path d="M55 445 H85 M55 445 V415" stroke="#29c5ff" stroke-width="5" fill="none"/>
  <path d="M1315 445 H1345 M1345 445 V415" stroke="#29c5ff" stroke-width="5" fill="none"/>

  <!-- Cabeçalho -->

  <text x="95" y="95"
        class="pixel green"
        font-size="24">
        Welcome to GitHub 👾
  </text>

  <!-- Nome -->

  <text x="95" y="185" class="pixel title">
    CAIO
  </text>

  <text x="95" y="305" class="pixel title">
    SOUSA
  </text>

  <!-- Skills -->

  <text
    x="95"
    y="365"
    class="pixel purple"
    font-size="28">

    JAVA DEVELOPER • BACKEND • OOP • API • DATABASES

  </text>

  <!-- Linha -->

  <line
    x1="95"
    y1="395"
    x2="1110"
    y2="395"
    stroke="#4338ff"
    stroke-width="2"
  />

  <!-- Texto -->

  <text
    x="95"
    y="450"
    class="pixel"
    font-size="26">

    <tspan fill="#00ffd0">Hello, World!</tspan>

    <tspan fill="#ffffff">
      Transformando café em código e ideias em soluções.
    </tspan>

  </text>

  <!-- Login -->

  <circle cx="105" cy="495" r="10" fill="#ffe600"/>

  <text
    x="130"
    y="502"
    class="pixel white"
    font-size="18">

    Logged in as user:

  </text>

  <text
    x="395"
    y="502"
    class="pixel"
    font-size="18"
    fill="#ffe600">

    caiosousa

  </text>

  <!-- Terminal -->

  <text
    x="95"
    y="535"
    class="pixel white"
    font-size="20">

    ~/JavaRepo

  </text>

  <text
    x="270"
    y="535"
    class="pixel"
    font-size="20"
    fill="#4f46ff">

    [main]

  </text>

  <!-- Pacman -->

  <circle
    cx="980"
    cy="190"
    r="60"
    fill="#ffe600"
    filter="url(#glowYellow)"
  />

  <polygon
    points="980,190 1045,150 1045,230"
    fill="#02050d"
  />

  <!-- Pellets -->

  <circle cx="1085" cy="190" r="6" fill="white"/>
  <circle cx="1130" cy="190" r="6" fill="white"/>
  <circle cx="1175" cy="190" r="6" fill="white"/>
  <circle cx="1220" cy="190" r="6" fill="white"/>

  <!-- Fantasma vermelho -->

  <g transform="translate(1260,145)">
    <path d="M0 40
             Q0 0 35 0
             Q70 0 70 40
             V85
             L58 73
             L46 85
             L35 73
             L23 85
             L12 73
             L0 85 Z"
          fill="#ff3030"/>
    <circle cx="24" cy="35" r="8" fill="white"/>
    <circle cx="46" cy="35" r="8" fill="white"/>
    <circle cx="27" cy="37" r="3" fill="#4169e1"/>
    <circle cx="49" cy="37" r="3" fill="#4169e1"/>
  </g>

  <!-- Fantasma rosa -->

  <g transform="translate(1340,145)">
    <path d="M0 40
             Q0 0 35 0
             Q70 0 70 40
             V85
             L58 73
             L46 85
             L35 73
             L23 85
             L12 73
             L0 85 Z"
          fill="#ff9be7"/>
    <circle cx="24" cy="35" r="8" fill="white"/>
    <circle cx="46" cy="35" r="8" fill="white"/>
    <circle cx="27" cy="37" r="3" fill="#4169e1"/>
    <circle cx="49" cy="37" r="3" fill="#4169e1"/>
  </g>

</svg>
